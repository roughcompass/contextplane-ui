name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes test-colocation check)
        run: pnpm lint
      - name: Type-check
        run: pnpm type-check
      - name: Test (coverage thresholds enforced)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Generated-client drift check (pinned contract)
        run: |
          pnpm generate:api
          git diff --exit-code -- apps/admin-dashboard/src/shared/api/generated/ contracts/
      - name: Bundle size report (budget enforcement pending baseline)
        run: du -sh apps/admin-dashboard/dist/assets/* | sort -rh | head -20
